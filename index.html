<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>Venom's Index | Real-Time Stock Market News, Sentiment & Insights</title>

    <!-- Meta Description (SEO) -->
    <meta name="description" content="Venom's Index is a real-time AI-powered browser extension delivering credible business and stock market news with sentiment scores and investment insights." />

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/venoms-logo.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Venom's Index | Real-Time Stock Market News & Insights" />
    <meta property="og:description" content="Stay ahead with curated market news, AI-generated sentiment, and credibility ratings—all in one smart browser extension for investors." />
    <meta property="og:image" content="https://venomsindex.com/venoms-logo.png" />
    <meta property="og:url" content="https://venomsindex.com/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Venom's Index | Smart Financial News, Credibility & Sentiment" />
    <meta name="twitter:description" content="Get curated stock news, sentiment analysis, and credibility scores with Venom's Index—the smart extension for financial awareness." />
    <meta name="twitter:image" content="https://venomsindex.com/venoms-logo.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Venom's Index",
      "url": "https://venomsindex.com",
      "logo": "https://venomsindex.com/venoms-logo.png",
      "description": "Venom's Index offers AI-driven stock predictions, curated business news, and sentiment scores to help investors make informed decisions.",
      "sameAs": [
        "https://x.com/venomsindex01",
        "https://www.linkedin.com/company/venomsindex"
      ]
    }
    </script>

    <!-- Optional: Google Search Console Verification -->
    <!-- <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE_HERE" /> -->
  </head>

  <body>
    <div id="root"></div>

    <!-- ✅ Correct way to include app entry point with Vite -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
